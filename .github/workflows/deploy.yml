name: Meeting Name Copy Release Build
on:
  push:
    branches: [fix/name-copy-20261115]
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Required checks
        run: |
          pnpm exec eslint src/components/meetings/LocationStep.tsx
          pnpm check:i18n
          pnpm test:globalization
          pnpm astro sync
          pnpm check:types
          python3 -m unittest discover -s scripts -p test_cloud_run_guard.py
          python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - run: pnpm build
      - name: Verify name input in all languages
        run: |
          pnpm exec playwright install --with-deps chromium
          HOST=127.0.0.1 PORT=14337 node dist/server/entry.mjs > /tmp/name-copy-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do curl --silent --fail http://127.0.0.1:14337/meetings/create > /dev/null && break; sleep 1; done
          NAME_COPY_OUTPUT=qa-evidence node scripts/verify-meeting-name-copy.mjs
      - run: python3 scripts/release-artifact.py create --revision "$GITHUB_SHA"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
      - run: docker buildx create --driver docker-container --use --bootstrap
      - name: Build and push verified artifact
        run: |
          python3 scripts/build-release-image.py --image "asia-northeast3-docker.pkg.dev/time2gather-prod-2026/time2gather/web:name-copy-${GITHUB_SHA}" --cache "asia-northeast3-docker.pkg.dev/time2gather-prod-2026/time2gather/web:buildcache" --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: name-copy-release
          path: |
            dist
            release-manifest.json
            build-metrics.json
            image-metadata.json
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: name-copy-browser-checks
          path: qa-evidence
          retention-days: 7
