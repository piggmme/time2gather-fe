name: Frontend CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  CLOUD_RUN_SERVICE: time2gather-web
  CLOUD_RUN_SERVICE_ACCOUNT: time2gather-web@time2gather-prod-2026.iam.gserviceaccount.com

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push Cloud Run image
        run: |
          gcloud builds submit \
            --project "$GCP_PROJECT_ID" \
            --tag "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/time2gather/web:$GITHUB_SHA" \
            .

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --image "$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/time2gather/web:$GITHUB_SHA" \
            --service-account "$CLOUD_RUN_SERVICE_ACCOUNT" \
            --set-env-vars SITE_URL=https://time2gather.org \
            --quiet

      - name: Set up Node.js for Firebase
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Deploy Firebase Hosting
        run: npx --yes firebase-tools@15 deploy --only hosting --project "$GCP_PROJECT_ID"

      - name: Verify production
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://time2gather.org/meetings/create --output /dev/null
