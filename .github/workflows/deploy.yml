name: Mobile Calendar Release Build
on:
  push:
    branches: [release/mobile-calendar-20261113]
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Required checks
        run: |
          pnpm check:i18n
          pnpm test:globalization
          pnpm astro sync
          pnpm check:types
          pnpm exec eslint src/components/ResultPage/ResultContent.tsx scripts/test-calendar-vote-action.mjs
          python3 -m unittest discover -s scripts -p test_cloud_run_guard.py
          python3 -m unittest discover -s scripts -p 'test_release_*.py'
      - run: pnpm build
      - run: python3 scripts/release-artifact.py create --revision "$GITHUB_SHA"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
      - run: docker buildx create --driver docker-container --use --bootstrap
      - name: Build and push verified artifact
        run: |
          python3 scripts/build-release-image.py             --image "asia-northeast3-docker.pkg.dev/time2gather-prod-2026/time2gather/web:calendar-vote-${GITHUB_SHA}"             --cache "asia-northeast3-docker.pkg.dev/time2gather-prod-2026/time2gather/web:buildcache"             --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: calendar-vote-release
          path: |
            dist
            release-manifest.json
            build-metrics.json
            image-metadata.json
          include-hidden-files: true
          retention-days: 7
