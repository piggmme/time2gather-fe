name: Frontend CI & Release Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Build the release image after required checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: pnpm
      - name: Install dependencies for browser setup
        run: pnpm install --frozen-lockfile
      - name: Install browser system dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Run the same preflight as local pushes
        run: python3 scripts/frontend_preflight.py run
      - name: Bind the tested release artifact
        run: python3 scripts/release-artifact.py create --revision "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            dist
            release-manifest.json
          include-hidden-files: true
          retention-days: 7
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-checks
          path: .preflight/evidence/**/verification.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  image:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || (github.event_name == 'workflow_dispatch' && inputs.publish_image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .
      - name: Verify downloaded artifact
        run: python3 scripts/release-artifact.py verify --revision "$GITHUB_SHA"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker asia-northeast3-docker.pkg.dev --quiet
      - run: docker buildx create --driver docker-container --use --bootstrap
      - name: Build and push verified artifact
        run: |
          python3 scripts/build-release-image.py \
            --image "asia-northeast3-docker.pkg.dev/time2gather-prod-2026/time2gather/web:$GITHUB_SHA" \
            --cache "asia-northeast3-docker.pkg.dev/time2gather-prod-2026/time2gather/web:buildcache" \
            --revision "$GITHUB_SHA"
      - name: Upload release measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: |
            build-metrics.json
            image-metadata.json
            image-build.log
          if-no-files-found: warn
          retention-days: 7
